<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <!-- Official Makhé India Brand Logo -->
  <defs>
    <!-- Soft drop shadow for crisp rendering -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2B1408" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(250, 0)">
    <!-- 1. CIRCULAR EMBLEM (Centered at X=0, Y=125) -->
    <g transform="translate(0, 125)">
      <!-- Outer Decorative Rings with Star -->
      <!-- Outermost Ring -->
      <circle cx="0" cy="0" r="98" fill="none" stroke="#401F0E" stroke-width="2.2" />
      
      <!-- Inner Thin Ring -->
      <circle cx="0" cy="0" r="93" fill="none" stroke="#401F0E" stroke-width="1.4" />

      <!-- Gap Ring -->
      <circle cx="0" cy="0" r="89" fill="none" stroke="#401F0E" stroke-width="0.8" opacity="0.5" />

      <!-- Main Rich Chocolate Brown Disc -->
      <circle cx="0" cy="0" r="86" fill="#401F0E" />

      <!-- Top 4-Point Star / Diamond at 12 o'clock -->
      <g transform="translate(0, -98)">
        <path d="M 0 -10 Q 0 -2 7 -2 Q 0 -2 0 6 Q 0 -2 -7 -2 Q 0 -2 0 -10 Z" fill="#D9A35E" />
      </g>

      <!-- Stylized 'M' Architecture in Warm Golden Tan (#D9A35E) -->
      <!-- Left Wing of M -->
      <path d="M -62 76 L -58 -18 L -40 -64 C -37 -67, -31 -50, -29 -38 L -14 30 L -27 30 L -36 -16 L -44 76 Z" fill="#D9A35E" />

      <!-- Right Wing of M -->
      <path d="M 62 76 L 58 -18 L 40 -64 C 37 -67, 31 -50, 29 -38 L 14 30 L 27 30 L 36 -16 L 44 76 Z" fill="#D9A35E" />

      <!-- Base arc of M -->
      <path d="M -46 76 C -18 86, 18 86, 46 76 L 38 70 C 16 78, -16 78, -38 70 Z" fill="#D9A35E" />

      <!-- 2. LOTUS FLOWER CUP -->
      <!-- Outer Chalice Petals -->
      <path d="M -22 10 C -31 -5, -24 -20, -18 -26 C -12 -12, -12 2, -16 16 Z" fill="#D9A35E" />
      <path d="M 22 10 C 31 -5, 24 -20, 18 -26 C 12 -12, 12 2, 16 16 Z" fill="#D9A35E" />

      <!-- Main Center Lotus Cup Base -->
      <path d="M -18 16 C -20 28, -9 38, 0 38 C 9 38, 20 28, 18 16 C 11 24, -11 24, -18 16 Z" fill="#D9A35E" />

      <!-- Lower Horizontal Leaf Wings -->
      <path d="M 0 32 C -14 32, -32 28, -44 20 C -30 32, -10 36, 0 37 C 10 36, 30 32, 44 20 C 32 28, 14 32, 0 32 Z" fill="#D9A35E" />

      <!-- 3. PUFFED MAKHANA SEED -->
      <g transform="translate(0, 0)">
        <!-- Kernel Body -->
        <path d="M 0 -22 C 9 -22, 16 -13, 15 0 C 13 13, 7 21, 0 22 C -7 21, -13 13, -15 0 C -16 -13, -9 -22, 0 -22 Z" fill="#FAF6EE" />
        <!-- Inner shadow curve -->
        <path d="M 0 -20 C 7 -20, 13 -12, 12 -1 C 10 10, 5 18, 0 19 C -5 18, -10 10, -12 -1 C -13 -12, -7 -20, 0 -20 Z" fill="none" stroke="#E8DCBE" stroke-width="1" />
        
        <!-- Natural Dark Speckles / Fissures of Makhana -->
        <ellipse cx="-2.5" cy="-5" rx="2.5" ry="3" fill="#401F0E" opacity="0.9" />
        <circle cx="-6" cy="-2" r="1.4" fill="#401F0E" opacity="0.85" />
        <circle cx="-2" cy="-11" r="1.2" fill="#401F0E" opacity="0.8" />
        <circle cx="2" cy="-6" r="1.5" fill="#401F0E" opacity="0.85" />
        <circle cx="5" cy="-2" r="1.1" fill="#401F0E" opacity="0.75" />
        <circle cx="-1" cy="2" r="1.3" fill="#401F0E" opacity="0.8" />
        <circle cx="-4" cy="6" r="1" fill="#401F0E" opacity="0.7" />
        <circle cx="3" cy="7" r="1.2" fill="#401F0E" opacity="0.7" />
        <!-- Natural seed line -->
        <path d="M 1 -15 C 3 -8, 2 -1, 3 10" fill="none" stroke="#B8966E" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
      </g>
    </g>

    <!-- 2. WORDMARK: Makhé India -->
    <g transform="translate(0, 310)">
      <text text-anchor="middle" y="0">
        <!-- 'Makhé' in Deep Chocolate Brown (#401F0E) with elegant flared serifs -->
        <tspan fill="#401F0E" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="64" font-weight="600" letter-spacing="1.5">Makhé</tspan>
        <!-- 'India' in Golden Tan (#D9A35E) -->
        <tspan dx="16" fill="#D9A35E" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="64" font-weight="400" letter-spacing="1">India</tspan>
      </text>
    </g>
  </g>
</svg>