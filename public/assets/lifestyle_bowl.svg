<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4E311F" />
      <stop offset="45%" stop-color="#341E11" />
      <stop offset="100%" stop-color="#1A0D07" />
    </radialGradient>

    <linearGradient id="brassBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA821C" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#694B0A" />
    </linearGradient>

    <radialGradient id="puffCore" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDF9F2" />
      <stop offset="75%" stop-color="#EFE4CF" />
      <stop offset="100%" stop-color="#D3BE9D" />
    </radialGradient>

    <filter id="bowlDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#0E0704" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Rustic Dark Teak Wood Surface -->
  <rect width="1400" height="750" fill="url(#tableGlow)" />

  <!-- Natural Wood Grain Strata -->
  <g stroke="#26140B" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="120" x2="1400" y2="120" />
    <line x1="0" y1="240" x2="1400" y2="240" />
    <line x1="0" y1="380" x2="1400" y2="380" />
    <line x1="0" y1="520" x2="1400" y2="520" />
    <line x1="0" y1="640" x2="1400" y2="640" />
  </g>

  <!-- Linen Cloth Drape Left -->
  <path d="M 0 200 Q 300 240, 440 480 Q 500 620, 480 750 L 0 750 Z" fill="#EAE2D3" opacity="0.15" />
  <path d="M 0 280 Q 260 320, 390 520 Q 420 620, 390 750 L 0 750 Z" fill="#D8CFBF" opacity="0.12" />

  <!-- Warm Raking Golden Sunlight Beam -->
  <polygon points="200,0 700,0 1200,750 400,750" fill="#FFF2D6" opacity="0.04" />

  <!-- Center Focal Point: Handcrafted Beaten Indian Brass Katori Bowl overflowing with Roasted Makhana -->
  <g transform="translate(700, 460)" filter="url(#bowlDropShadow)">
    <!-- Deep Contact Shadow -->
    <ellipse cx="0" cy="180" rx="340" ry="50" fill="#0C0603" opacity="0.85" filter="blur(18px)" />

    <!-- Hammered Brass Bowl Outer Silhouette -->
    <path d="M -320 20 
             C -320 180, -220 220, 0 220 
             C 220 220, 320 180, 320 20 
             C 320 20, 240 -10, 0 -10 
             C -240 -10, -320 20, -320 20 Z" 
          fill="url(#brassBowl)" 
          stroke="#4D3404" 
          stroke-width="3" />

    <!-- Rim Flange with Traditional Hammered Indentations -->
    <ellipse cx="0" cy="15" rx="318" ry="34" fill="#AA821C" stroke="#FDF3DC" stroke-width="1.5" />
    <ellipse cx="0" cy="15" rx="310" ry="30" fill="#3D2908" />

    <!-- Brass Hammered Texture Facets -->
    <g fill="#F7DF94" opacity="0.2">
      <ellipse cx="-160" cy="90" rx="22" ry="14" />
      <ellipse cx="-80" cy="110" rx="26" ry="16" />
      <ellipse cx="0" cy="120" rx="30" ry="18" />
      <ellipse cx="90" cy="110" rx="26" ry="16" />
      <ellipse cx="170" cy="85" rx="24" ry="14" />
      <ellipse cx="-120" cy="150" rx="20" ry="12" />
      <ellipse cx="0" cy="170" rx="28" ry="14" />
      <ellipse cx="110" cy="150" rx="22" ry="12" />
    </g>

    <!-- Piled High Roasted Jumbo Makhana Heap (Realistic 3D Foxnut Cluster) -->
    <!-- Lower / Mid Stack -->
    <g stroke="#C4B090" stroke-width="0.9">
      <!-- Outer perimeter puffs -->
      <circle cx="-230" cy="-10" r="42" fill="url(#puffCore)" />
      <circle cx="230" cy="-10" r="44" fill="url(#puffCore)" />
      <circle cx="-160" cy="-45" r="48" fill="url(#puffCore)" />
      <circle cx="160" cy="-45" r="50" fill="url(#puffCore)" />
      <circle cx="-260" cy="15" r="36" fill="url(#puffCore)" />
      <circle cx="260" cy="15" r="38" fill="url(#puffCore)" />

      <!-- Center Base Puffs -->
      <circle cx="-80" cy="-20" r="54" fill="url(#puffCore)" />
      <circle cx="80" cy="-20" r="56" fill="url(#puffCore)" />
      <circle cx="0" cy="-35" r="58" fill="url(#puffCore)" />

      <!-- Upper Tier Puffs (High Mountain Heap) -->
      <g transform="translate(-100, -90)">
        <path d="M 0 -35 C -35 -30, -50 -5, -42 25 C -34 45, 10 52, 38 38 C 58 20, 52 -18, 25 -32 Z" fill="url(#puffCore)" />
        <circle cx="-10" cy="4" r="5" fill="#8C5C26" opacity="0.65" />
        <circle cx="14" cy="-10" r="3.5" fill="#75471B" opacity="0.7" />
        <path d="M -20 -8 Q 0 14, 20 -4" fill="none" stroke="#B89B72" stroke-width="2" />
      </g>

      <g transform="translate(100, -95)">
        <path d="M 0 -38 C -36 -32, -54 -8, -44 26 C -36 48, 12 55, 42 40 C 62 22, 54 -20, 26 -35 Z" fill="url(#puffCore)" />
        <circle cx="-12" cy="6" r="4.5" fill="#8C5C26" opacity="0.65" />
        <circle cx="15" cy="-8" r="3.5" fill="#75471B" opacity="0.7" />
        <path d="M -22 -6 Q 0 16, 22 -2" fill="none" stroke="#B89B72" stroke-width="2" />
      </g>

      <!-- Center Summit Giant King Puff -->
      <g transform="translate(0, -125)">
        <path d="M 0 -45 C -45 -40, -65 -10, -52 32 C -42 58, 15 65, 50 48 C 74 26, 65 -25, 30 -42 Z" fill="url(#puffCore)" stroke="#BFA885" stroke-width="1.2" />
        <circle cx="-14" cy="8" r="6" fill="#8C5C26" opacity="0.7" />
        <circle cx="18" cy="-12" r="4.5" fill="#75471B" opacity="0.75" />
        <circle cx="2" cy="24" r="4" fill="#94632E" opacity="0.6" />
        <path d="M -26 -10 Q 0 18, 26 -6" fill="none" stroke="#B89B72" stroke-width="2.5" />
      </g>

      <!-- Front Cascading Overflowing Puffs over Rim -->
      <g transform="translate(-130, 25)">
        <ellipse cx="0" cy="0" rx="38" ry="32" fill="url(#puffCore)" />
        <circle cx="-4" cy="2" r="4" fill="#8C5C26" opacity="0.6" />
      </g>
      <g transform="translate(120, 30)">
        <ellipse cx="0" cy="0" rx="42" ry="34" fill="url(#puffCore)" />
        <circle cx="5" cy="-3" r="4.5" fill="#75471B" opacity="0.6" />
      </g>
      <g transform="translate(0, 15)">
        <ellipse cx="0" cy="0" rx="46" ry="38" fill="url(#puffCore)" />
        <circle cx="-6" cy="4" r="5" fill="#8C5C26" opacity="0.65" />
      </g>
    </g>

    <!-- Scattered Roasted Spices (Crushed Pink Himalayan Rock Salt & Coarse Black Pepper) -->
    <g fill="#382618" opacity="0.8">
      <circle cx="-45" cy="-90" r="2.5" />
      <circle cx="35" cy="-110" r="2" />
      <circle cx="-15" cy="-60" r="2.8" />
      <circle cx="70" cy="-70" r="2" />
      <circle cx="-90" cy="-30" r="2.2" />
      <circle cx="110" cy="-35" r="2.5" />
    </g>
    <!-- Pink Rock Salt Specks -->
    <g fill="#EAAFA8" opacity="0.9">
      <rect x="-30" y="-120" width="3.5" height="3.5" rx="1" />
      <rect x="25" y="-85" width="4" height="4" rx="1" />
      <rect x="-80" y="-70" width="3" height="3" rx="1" />
      <rect x="85" y="-45" width="3.5" height="3.5" rx="1" />
      <rect x="5" y="-20" width="4" height="4" rx="1" />
    </g>
  </g>

  <!-- Scattered Crisp Makhana on Wood Table in Foreground -->
  <g transform="translate(260, 560)">
    <ellipse cx="0" cy="15" rx="30" ry="8" fill="#0C0603" opacity="0.5" filter="blur(4px)" />
    <circle cx="0" cy="0" r="26" fill="url(#puffCore)" stroke="#C4B090" stroke-width="0.8" />
    <circle cx="-3" cy="2" r="3" fill="#8C5C26" opacity="0.6" />
  </g>
  <g transform="translate(350, 620)">
    <ellipse cx="0" cy="12" rx="24" ry="6" fill="#0C0603" opacity="0.5" filter="blur(3px)" />
    <circle cx="0" cy="0" r="22" fill="url(#puffCore)" stroke="#C4B090" stroke-width="0.8" />
  </g>
  <g transform="translate(1120, 580)">
    <ellipse cx="0" cy="15" rx="34" ry="9" fill="#0C0603" opacity="0.5" filter="blur(4px)" />
    <circle cx="0" cy="0" r="30" fill="url(#puffCore)" stroke="#C4B090" stroke-width="0.8" />
    <circle cx="4" cy="-2" r="3.5" fill="#75471B" opacity="0.6" />
  </g>
  <g transform="translate(1220, 630)">
    <ellipse cx="0" cy="12" rx="22" ry="6" fill="#0C0603" opacity="0.5" filter="blur(3px)" />
    <circle cx="0" cy="0" r="20" fill="url(#puffCore)" stroke="#C4B090" stroke-width="0.8" />
  </g>

  <!-- Editorial Typographic Inset Label: Visual Breathing Space -->
  <g transform="translate(100, 80)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#C59B27" stroke-width="1.5" />
    <text x="42" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E5C778" letter-spacing="3">RITUAL OF PURITY</text>
    <text x="0" y="52" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#FAF7F2" font-style="italic">
      Golden roasted in small batches.
    </text>
    <text x="0" y="80" font-family="'Noto Serif Devanagari', serif" font-size="18" fill="#C59B27">
      स्वाद जो दिल जीत ले, सेहत जो साथ दे।
    </text>
  </g>
</svg>
