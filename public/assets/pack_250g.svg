<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="makhanaPuff250" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#D9C7AC" />
    </radialGradient>
    <filter id="packShadow250" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#0E0805" flood-opacity="0.48" />
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="270" cy="660" rx="220" ry="26" fill="#140A06" opacity="0.42" filter="blur(12px)" />

  <!-- 250g Oversized Powerpack Pouch Body -->
  <g filter="url(#packShadow250)">
    <path d="M 85 40 
             L 455 40 
             L 485 610 
             C 485 650, 55 650, 55 610 
             Z" 
          fill="#FAF8F3" 
          stroke="#D8CCA8" 
          stroke-width="2.5" />

    <!-- Top Crimped Seal with Tear Notch -->
    <rect x="80" y="40" width="380" height="32" fill="#EFE8D6" stroke="#BAA780" stroke-width="1.2" />
    <line x1="90" y1="56" x2="450" y2="56" stroke="#AA956C" stroke-width="1.8" stroke-dasharray="6 3" />
    <path d="M 80 50 L 90 56 L 80 62 Z" fill="#8C6E48" />
    <path d="M 460 50 L 450 56 L 460 62 Z" fill="#8C6E48" />

    <!-- Corner Lotus Vines (Coral Pink & Botanical Green) -->
    <g transform="translate(95, 78)">
      <path d="M 8 8 Q 28 -5, 42 12 Q 22 30, 8 8 Z" fill="#3D5A42" />
      <circle cx="22" cy="24" r="15" fill="#D84457" />
      <circle cx="20" cy="20" r="11" fill="#EB6374" />
      <circle cx="18" cy="18" r="6" fill="#FFE585" />
    </g>
    <g transform="translate(370, 78)">
      <path d="M 38 8 Q 18 -5, 4 12 Q 24 30, 38 8 Z" fill="#3D5A42" />
      <circle cx="24" cy="24" r="15" fill="#D84457" />
      <circle cx="26" cy="20" r="11" fill="#EB6374" />
      <circle cx="28" cy="18" r="6" fill="#FFE585" />
    </g>

    <!-- Brand Header -->
    <g transform="translate(270, 155)">
      <circle cx="0" cy="-24" r="20" fill="#1C1008" stroke="#DCA24E" stroke-width="1.2" />
      <path d="M -10 -26 C -7 -35, 0 -33, 0 -24 C 0 -33, 7 -35, 10 -26 Z" fill="#FAF5EC" />
      <text x="0" y="10" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#281A12" letter-spacing="2">
        Makhé India
      </text>
    </g>

    <!-- Subtitle & Main Title -->
    <g transform="translate(270, 215)">
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#84582C" letter-spacing="3">
        PREMIUM QUALITY
      </text>
      <text x="0" y="34" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="800" fill="#1C110B" letter-spacing="3">
        APNA
      </text>
      <text x="0" y="74" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="800" fill="#1C110B" letter-spacing="4">
        MAKHANA
      </text>
      <text x="0" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6E4F2E" letter-spacing="1.2">
        POPPED WITH PURITY, PACKED WITH POWER
      </text>
    </g>

    <!-- Center Left Circular Window -->
    <g transform="translate(205, 415)">
      <circle cx="0" cy="0" r="84" fill="#1A110B" stroke="#B88A44" stroke-width="2.5" />
      <circle cx="0" cy="0" r="80" fill="#FAF5EC" />

      <!-- Puffed Makhana Inside Window -->
      <g stroke="#C6B59D" stroke-width="0.8">
        <circle cx="-32" cy="-30" r="24" fill="url(#makhanaPuff250)" />
        <circle cx="30" cy="-28" r="26" fill="url(#makhanaPuff250)" />
        <circle cx="-38" cy="20" r="22" fill="url(#makhanaPuff250)" />
        <circle cx="34" cy="18" r="24" fill="url(#makhanaPuff250)" />
        <circle cx="0" cy="-42" r="20" fill="url(#makhanaPuff250)" />
        <circle cx="0" cy="0" r="30" fill="url(#makhanaPuff250)" />
        <circle cx="-8" cy="-5" r="3" fill="#693F16" opacity="0.6" />
        <circle cx="12" cy="7" r="2.2" fill="#693F16" opacity="0.6" />
      </g>
    </g>

    <!-- Center Right Farmer -->
    <g transform="translate(365, 425)">
      <path d="M -32 -52 C -42 -72, 32 -78, 42 -52 C 48 -36, -22 -36, -32 -52 Z" fill="#D94326" />
      <path d="M -22 -58 Q 0 -72, 28 -55" stroke="#FAF2DC" stroke-width="2" fill="none" />
      <ellipse cx="6" cy="-26" rx="20" ry="22" fill="#C98B58" />
      <path d="M -8 -15 Q 6 -10, 20 -15" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M -38 0 L 48 0 L 56 95 L -45 95 Z" fill="#DDA027" />
      <ellipse cx="6" cy="58" rx="24" ry="18" fill="#C98B58" />
      <circle cx="-6" cy="53" r="10" fill="#FAF5EC" />
      <circle cx="11" cy="51" r="11" fill="#FAF5EC" />
    </g>

    <!-- Bottom Badge: 250 GM POWERPACK -->
    <g transform="translate(270, 580)">
      <rect x="-130" y="0" width="260" height="36" rx="4" fill="#C59438" />
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#140B06" letter-spacing="2">
        250 GM POWERPACK
      </text>

      <g transform="translate(0, 50)">
        <text x="-105" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C110B">FAMILY SAVINGS</text>
        <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C110B">HIGH PROTEIN</text>
        <text x="105" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C110B">GLUTEN FREE</text>
      </g>
    </g>
  </g>
</svg>
